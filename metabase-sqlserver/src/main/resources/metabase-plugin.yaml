# This configuration is derived from its parent driver
# https://github.com/metabase/metabase/blob/master/modules/drivers/sqlserver/resources/metabase/sqlserver/metabase-plugin.yaml
info:
  name: SQL Server (custom decrypt) Driver
  version: ${project.version}
  description: SQL Server driver for decrypting application-level encrypted columns.
dependencies:
  - plugin: Metabase SQL Server Driver
driver:
  name: sqlserver-decrypt
  display-name: SQL Server (decrypt)
  lazy-load: true
  parent: sqlserver
  connection-properties:
    - name: decrypt-decryptors
      display-name: Decryptors
      type: text
      required: true
      placeholder: <decryptor name="pii" algorithm="aes-256-gcm" key="000102…1f"/>
      helper-text: "One <decryptor name=\"pii\" algorithm=\"aes-256-gcm\" key=\"<hex>\"/> per way values are encrypted; add iv=\"<hex>\" if the IV is fixed rather than stored with each value, and padding=\"spaces\" or padding=\"zeros\" for CBC plaintext padded with spaces or zero bytes instead of PKCS#7. Names are letters and digits. Native queries decrypt a column by aliasing it decrypt_<decryptor>_<name>, e.g. SELECT ssn AS decrypt_pii_ssn."
    - name: decrypt-rules
      display-name: Encrypted columns (optional)
      type: text
      placeholder: <rule pattern="customers.ssn" decryptor="pii"/>
      helper-text: "For query-builder questions, where Metabase writes the query: which columns to decrypt with which decryptor. One <rule> element per rule. pattern is [schema.][table.]column, or a /regex/ on the result column name."
    - group:
        container-style: ["grid", "3fr 1fr"]
        fields:
          - host
          - merge:
              - port
              - helper-text: Leave empty to use Dynamic Ports, or input specific port. Standard port is 1433.
    - merge:
        - dbname
        - name: db
          placeholder: BirdsOfTheWorld
    - name: instance
      display-name: Database instance name
      placeholder: N/A
    - name: auth-mode
      display-name: Authentication method
      type: select
      default: sql
      required: true
      options:
        - {name: "SQL Server login",                           value: "sql"}
        - {name: "Azure AD - Service principal",               value: "ad-service-principal"}
        - {name: "Azure AD - Service principal (certificate)", value: "ad-service-principal-certificate"}
        - {name: "Azure AD - Managed identity",                value: "ad-managed-identity"}
    - merge:
        - user
        - visible-if:
            auth-mode: sql
    - merge:
        - password
        - visible-if:
            auth-mode: sql
    - name: ad-client-id
      display-name: Client ID
      helper-text: The Entra application (client) ID of the service principal.
      placeholder: 00000000-0000-0000-0000-000000000000
      required: true
      visible-if:
        auth-mode: [ad-service-principal, ad-service-principal-certificate]
    - name: ad-client-secret
      display-name: Client secret
      type: password
      required: true
      visible-if:
        auth-mode: ad-service-principal
    - name: ad-client-certificate
      display-name: Client certificate
      helper-text: The Microsoft Entra service principal certificate.
      type: secret
      secret-kind: keystore
      required: true
      visible-if:
        auth-mode: ad-service-principal-certificate
    - name: ad-client-certificate-password
      display-name: Certificate password
      helper-text: If the certificate needs a password, provide it here.
      type: secret
      secret-kind: password
      visible-if:
        auth-mode: ad-service-principal-certificate
    - name: ad-client-key
      display-name: Client key
      helper-text: Only needed if the private key is in a separate file from the certificate.
      type: secret
      secret-kind: pem-cert
      visible-if:
        auth-mode: ad-service-principal-certificate
    - name: ad-client-key-password
      display-name: Client key password
      helper-text: Only needed if the separate private key file is encrypted.
      type: secret
      secret-kind: password
      visible-if:
        auth-mode: ad-service-principal-certificate
    - name: ad-managed-identity-client-id
      display-name: Managed identity client ID
      helper-text: Optional. Fill in for a user-assigned managed identity; leave blank to use the default identity attached to the Metabase host.
      placeholder: 00000000-0000-0000-0000-000000000000
      visible-if:
        auth-mode: ad-managed-identity
    - name: role
      display-name: Default impersonation user (required for impersonation if the connection's user cannot be impersonated)
      helper-text: User used to run system queries, required if the connection's user cannot be impersonated, such as the 'sa' user.
      placeholder: user
    - cloud-ip-address-info
    - name: schema-filters
      type: schema-filters
      display-name: Schemas
    - group:
        container-style: ["component", "backdrop"]
        fields:
        - ssl
        - ssh-tunnel
    - advanced-options-start
    - merge:
        - additional-options
        - placeholder: "trustServerCertificate=false"
    - default-advanced-options
init:
  - step: load-namespace
    namespace: metabase.driver.sqlserver-decrypt
  - step: register-jdbc-driver
    class: mbdecrypt.jdbc.DecryptingDriver
