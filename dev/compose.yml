name: mbdecrypt

services:
  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.63.19.1}
    container_name: mbdecrypt-metabase
    ports:
      - "3000:3000"
      - "127.0.0.1:5005:5005"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PLUGINS_DIR: /plugins
      JAVA_TIMEZONE: UTC
      JAVA_OPTS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - metabase-data:/metabase-data

volumes:
  metabase-data:
