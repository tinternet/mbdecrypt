name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: core/target/site/jacoco
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: metabase-sqlserver/target/sqlserver-decrypt.metabase-driver.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin
      - run: gh release create "$GITHUB_REF_NAME" sqlserver-decrypt.metabase-driver.jar --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
